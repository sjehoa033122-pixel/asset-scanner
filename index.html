<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hospital Asset Scanner</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b6bcb"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="lib/html5-qrcode.min.js"></script>
<script src="lib/JsBarcode.all.min.js"></script>
<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#1b2430;--mu:#66717f;--br:#dde3ea;--pr:#0b6bcb;--ok:#1a8f4c;--wn:#c77700;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b232c;--tx:#e8edf2;--mu:#98a4b1;--br:#2d3844;--pr:#4aa3ff;--ok:#43c47a;--wn:#f0a73a;--bad:#ff6b6b}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b232c;--tx:#e8edf2;--mu:#98a4b1;--br:#2d3844;--pr:#4aa3ff;--ok:#43c47a;--wn:#f0a73a;--bad:#ff6b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:70px}
header{padding:14px 16px;font-weight:700;font-size:18px}header small{display:block;font-weight:400;color:var(--mu);font-size:12px}
main{padding:0 12px 12px;max-width:720px;margin:auto}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:12px;margin-bottom:12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--br);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mu);font:600 13px inherit}
nav button.on{color:var(--pr)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 2px}
input,select{width:100%;padding:10px;border:1px solid var(--br);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:11px 14px;border:0;border-radius:8px;background:var(--pr);color:#fff;font:600 14px inherit;width:100%;margin-top:10px}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--br)}.btn.d{background:var(--bad)}
.row{display:flex;gap:8px}.row>*{flex:1}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.ok{background:var(--ok)}.wn{background:var(--wn)}.bad{background:var(--bad)}.na{background:var(--mu)}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--br)}.item:last-child{border:0}
.mu{color:var(--mu);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stats div{text-align:center;padding:8px 2px;border-radius:8px;background:var(--bg)}.stats b{display:block;font-size:20px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}#sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
#reader{width:100%;border-radius:10px;overflow:hidden}
.tab{display:none}.tab.on{display:block}
.lbl{text-align:center;padding:8px;border:1px dashed var(--br);border-radius:8px;background:#fff;color:#000}
.lbl svg{max-width:100%}
@media print{body *{visibility:hidden}.printarea,.printarea *{visibility:visible}.printarea{position:absolute;left:0;top:0;width:100%}}
</style></head><body>
<header>Hospital Asset Scanner<small id="mode"></small></header>
<main>
<section id="t-scan" class="tab on">
 <div class="card"><div id="reader"></div>
  <button class="btn" id="startBtn">Start camera scan</button>
  <button class="btn s" id="photoBtn">Scan by photo (opens camera app)</button>
  <input type="file" id="photoIn" accept="image/*" capture="environment" style="display:none">
  <label>Or type / use a hardware scanner</label>
  <div class="row"><input id="manual" placeholder="Asset tag e.g. HSP-0001" autocapitalize="characters"><button class="btn s" style="width:90px;margin:0" id="goBtn">Find</button></div>
  <div class="mu" id="camMsg" style="margin-top:6px"></div></div>
</section>
<section id="t-assets" class="tab">
 <input id="q" placeholder="Search name, tag, department…" style="margin-bottom:10px">
 <div class="card" id="list"></div>
</section>
<section id="t-add" class="tab"><div class="card">
 <b id="formTitle">New asset</b>
 <label>Asset tag (auto-generated, editable)</label><input id="f_tag">
 <label>Asset name *</label><input id="f_name" placeholder="e.g. Patient monitor">
 <div class="row"><div><label>Category</label><select id="f_cat"><option>Medical equipment</option><option>Biomedical / lab</option><option>Furniture</option><option>IT equipment</option><option>Building / utility</option><option>Vehicle</option><option>Other</option></select></div>
 <div><label>Department / location</label><input id="f_loc" placeholder="ICU, Rm 204"></div></div>
 <div class="row"><div><label>Brand / model</label><input id="f_model"></div><div><label>Serial no.</label><input id="f_sn"></div></div>
 <div class="row"><div><label>Date purchased *</label><input type="date" id="f_buy"></div><div><label>Cost (₱)</label><input type="number" id="f_cost" inputmode="decimal"></div></div>
 <div class="row"><div><label>PMS every (months, 0 = none)</label><input type="number" id="f_int" value="0" min="0"></div><div><label>Last PMS date</label><input type="date" id="f_last"></div></div>
 <label>Condition</label><select id="f_cond"><option>Good</option><option>Fair</option><option>Needs repair</option><option>Condemned</option></select>
 <button class="btn" id="saveBtn">Save &amp; generate barcode</button>
 <button class="btn s" id="clearBtn">Clear form</button>
</div></section>
<section id="t-rep" class="tab">
 <div class="card"><div class="stats" id="stats"></div></div>
 <div class="card"><b>PMS due / overdue</b><div id="pmsList"></div></div>
 <button class="btn" id="csvBtn">Export CSV report</button>
 <button class="btn s" id="prtBtn">Print all barcode labels</button>
 <div class="printarea" id="labels" style="margin-top:12px"></div>
</section>
</main>
<nav><button data-t="scan" class="on">Scan</button><button data-t="assets">Assets</button><button data-t="add">Add</button><button data-t="rep">Report</button></nav>
<div id="modal"><div id="sheet"></div></div>
<script>
let assets=[],coll=null,scanner=null,editing=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-PH',{year:'numeric',month:'short',day:'numeric'}):'—';
const LS='hospital-assets-v1';
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(assets))}catch(e){}}
async function init(){
 assets=lsLoad();$('#mode').textContent='Saved on this device';render();
 try{
  const db=await claude.use('db');
  if(db){coll=db.collection('assets');$('#mode').textContent='Synced database';
   coll.onSnapshot(s=>{assets=s.docs.map(d=>d.data());render()},()=>{coll=null;$('#mode').textContent='Saved on this device'});}
 }catch(e){}
}
async function persist(a){
 const i=assets.findIndex(x=>x.tag===a.tag);if(i>=0)assets[i]=a;else assets.push(a);
 if(coll){try{await coll.doc(a.tag).set(a)}catch(e){lsSave()}}else lsSave();render();
}
async function remove(tag){
 assets=assets.filter(x=>x.tag!==tag);
 if(coll){try{await coll.doc(tag).delete()}catch(e){}}else lsSave();render();
}
function pms(a){
 const n=parseInt(a.interval)||0;
 if(!n)return{k:'na',t:'No PMS required',due:null};
 const base=a.lastPms||a.bought;if(!base)return{k:'wn',t:'PMS needed — no date on record',due:null};
 const d=new Date(base+'T00:00:00');d.setMonth(d.getMonth()+n);
 const days=Math.round((d-new Date(new Date().toDateString()))/864e5);
 const due=d.toISOString().slice(0,10);
 if(days<0)return{k:'bad',t:'PMS OVERDUE by '+(-days)+' day(s)',due,days};
 if(days<=30)return{k:'wn',t:'PMS due in '+days+' day(s)',due,days};
 return{k:'ok',t:'PMS up to date',due,days};
}
function age(b){if(!b)return'';const m=Math.floor((Date.now()-new Date(b))/2629800000);return m>=12?Math.floor(m/12)+' yr '+(m%12)+' mo':m+' mo'}
function nextTag(){const nums=assets.map(a=>parseInt((a.tag.match(/(\d+)$/)||[0,0])[1])).filter(n=>!isNaN(n));return 'HSP-'+String((nums.length?Math.max(...nums):0)+1).padStart(4,'0')}
function barcode(tag,el){try{JsBarcode(el,tag,{format:'CODE128',height:60,fontSize:14,margin:4})}catch(e){}}
function show(tag){
 const a=assets.find(x=>x.tag.toLowerCase()===String(tag).trim().toLowerCase());
 const sh=$('#sheet');
 if(!a){sh.innerHTML=`<h3>Not found</h3><p>No asset with tag <b>${esc(tag)}</b>.</p><button class="btn" id="addNew">Add as new asset</button><button class="btn s" onclick="closeM()">Close</button>`;
  $('#addNew').onclick=()=>{closeM();resetForm();$('#f_tag').value=String(tag).trim().toUpperCase();go('add')};}
 else{const p=pms(a);
  sh.innerHTML=`<div class="row" style="align-items:center"><h3 style="margin:0;flex:3">${esc(a.name)}</h3><span class="pill ${p.k}" style="flex:0 0 auto">${p.k=='ok'?'OK':p.k=='na'?'NO PMS':'PMS'}</span></div>
  <div class="mu">${esc(a.tag)} · ${esc(a.cat)}</div>
  <div class="card" style="margin-top:10px;border-color:var(--${p.k=='na'?'br':p.k})"><b>${p.t}</b><div class="mu">${p.due?'Next PMS: '+fmt(p.due)+' · every '+a.interval+' mo':''} ${a.lastPms?'· Last PMS: '+fmt(a.lastPms):''}</div></div>
  <div class="item"><span>Date purchased</span><b>${fmt(a.bought)}</b></div>
  <div class="item"><span>Age</span><b>${age(a.bought)||'—'}</b></div>
  <div class="item"><span>Location</span><b>${esc(a.loc)||'—'}</b></div>
  <div class="item"><span>Brand / model</span><b>${esc(a.model)||'—'}</b></div>
  <div class="item"><span>Serial no.</span><b>${esc(a.sn)||'—'}</b></div>
  <div class="item"><span>Cost</span><b>${a.cost?'₱'+Number(a.cost).toLocaleString():'—'}</b></div>
  <div class="item"><span>Condition</span><b>${esc(a.cond)}</b></div>
  <div class="lbl" style="margin-top:8px"><svg id="bc"></svg></div>
  <button class="btn" id="donePms">Mark PMS done today</button>
  <div class="row"><button class="btn s" id="edBtn">Edit</button><button class="btn s" id="delBtn">Delete</button></div>
  <button class="btn s" onclick="closeM()">Close</button>`;
  barcode(a.tag,$('#bc'));
  $('#donePms').onclick=()=>{a.lastPms=new Date().toISOString().slice(0,10);persist(a);show(a.tag)};
  $('#edBtn').onclick=()=>{closeM();edit(a)};
  $('#delBtn').onclick=()=>{if(confirm('Delete '+a.tag+'?')){remove(a.tag);closeM()}};}
 $('#modal').classList.add('on');
}
function closeM(){$('#modal').classList.remove('on')}
$('#modal').onclick=e=>{if(e.target.id=='modal')closeM()};
function go(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id=='t-'+t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
 if(t!='scan')stopScan();if(t=='add'&&!editing&&!$('#f_tag').value)$('#f_tag').value=nextTag();window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
async function stopScan(){if(scanner){try{await scanner.stop();scanner.clear()}catch(e){}scanner=null;$('#startBtn').textContent='Start camera scan'}}
$('#startBtn').onclick=async()=>{
 if(scanner)return stopScan();
 try{scanner=new Html5Qrcode('reader');
  await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:140}},txt=>{stopScan();show(txt)},()=>{});
  $('#startBtn').textContent='Stop camera';$('#camMsg').textContent='';
 }catch(e){scanner=null;$('#camMsg').textContent='Live camera is blocked here. Use Scan by photo, or type the tag.'}
};
$('#photoBtn').onclick=()=>$('#photoIn').click();
$('#photoIn').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 $('#camMsg').textContent='Reading barcode…';
 try{await stopScan();const h=new Html5Qrcode('reader');const t=await h.scanFile(f,false);try{h.clear()}catch(x){}$('#camMsg').textContent='';show(t)}
 catch(x){$('#camMsg').textContent='Could not read a barcode in that photo. Get closer, keep it flat and in focus, and try again.'}
 e.target.value='';
};
$('#goBtn').onclick=()=>{const v=$('#manual').value.trim();if(v){show(v);$('#manual').value=''}};
$('#manual').onkeydown=e=>{if(e.key=='Enter')$('#goBtn').click()};
const ids=['tag','name','cat','loc','model','sn','buy','cost','int','last','cond'];
function resetForm(){editing=null;ids.forEach(i=>$('#f_'+i).value='');$('#f_int').value=0;$('#f_cat').selectedIndex=0;$('#f_cond').selectedIndex=0;$('#formTitle').textContent='New asset';$('#f_tag').value=nextTag()}
function edit(a){editing=a.tag;$('#formTitle').textContent='Edit '+a.tag;
 Object.entries({tag:a.tag,name:a.name,cat:a.cat,loc:a.loc,model:a.model,sn:a.sn,buy:a.bought,cost:a.cost,int:a.interval,last:a.lastPms,cond:a.cond}).forEach(([k,v])=>$('#f_'+k).value=v||'');go('add')}
$('#clearBtn').onclick=resetForm;
$('#saveBtn').onclick=async()=>{
 const tag=$('#f_tag').value.trim().toUpperCase(),name=$('#f_name').value.trim(),bought=$('#f_buy').value;
 if(!tag||!name)return alert('Asset tag and name are required.');
 if(!bought&&!confirm('No purchase date entered. Save anyway?'))return;
 if(!editing&&assets.some(x=>x.tag===tag))return alert('That tag already exists.');
 const a={tag,name,cat:$('#f_cat').value,loc:$('#f_loc').value.trim(),model:$('#f_model').value.trim(),sn:$('#f_sn').value.trim(),bought,cost:$('#f_cost').value,interval:parseInt($('#f_int').value)||0,lastPms:$('#f_last').value,cond:$('#f_cond').value,created:new Date().toISOString()};
 await persist(a);resetForm();go('scan');show(tag);
};
function render(){
 const q=$('#q').value.toLowerCase();
 const l=assets.filter(a=>[a.tag,a.name,a.loc,a.cat,a.sn].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.tag.localeCompare(b.tag));
 $('#list').innerHTML=l.length?l.map(a=>{const p=pms(a);return`<div class="item" onclick="show('${esc(a.tag)}')"><div><b>${esc(a.name)}</b><div class="mu">${esc(a.tag)} · ${esc(a.loc)||'no location'} · bought ${fmt(a.bought)}</div></div><span class="pill ${p.k}">${p.k=='na'?'No PMS':p.k=='ok'?'OK':p.k=='wn'?'Due':'Overdue'}</span></div>`}).join(''):'<div class="mu">No assets yet. Tap Add to register your first one.</div>';
 const all=assets.map(a=>({a,p:pms(a)}));const c=k=>all.filter(x=>x.p.k==k).length;
 $('#stats').innerHTML=`<div><b>${assets.length}</b><span class="mu">Total</span></div><div><b style="color:var(--bad)">${c('bad')}</b><span class="mu">Overdue</span></div><div><b style="color:var(--wn)">${c('wn')}</b><span class="mu">Due soon</span></div><div><b style="color:var(--ok)">${c('ok')}</b><span class="mu">OK</span></div>`;
 const due=all.filter(x=>x.p.k=='bad'||x.p.k=='wn').sort((x,y)=>(x.p.days??-1e9)-(y.p.days??-1e9));
 $('#pmsList').innerHTML=due.length?due.map(x=>`<div class="item" onclick="show('${esc(x.a.tag)}')"><div><b>${esc(x.a.name)}</b><div class="mu">${esc(x.a.tag)} · ${esc(x.a.loc)}</div></div><span class="pill ${x.p.k}">${x.p.k=='bad'?'Overdue':'Due'}</span></div>`).join(''):'<div class="mu">Nothing due.</div>';
 $('#labels').innerHTML=assets.map(a=>`<div class="lbl" style="display:inline-block;width:48%;margin:1%;break-inside:avoid"><div style="font:600 11px sans-serif">${esc(a.name)}</div><svg class="lb" data-t="${esc(a.tag)}"></svg></div>`).join('');
 document.querySelectorAll('.lb').forEach(s=>barcode(s.dataset.t,s));
}
$('#q').oninput=render;
$('#prtBtn').onclick=()=>window.print();
$('#csvBtn').onclick=async()=>{
 const h=['Tag','Name','Category','Location','Brand/Model','Serial','Date Purchased','Age','Cost','Condition','PMS Interval (mo)','Last PMS','Next PMS','PMS Status'];
 const rows=assets.map(a=>{const p=pms(a);return[a.tag,a.name,a.cat,a.loc,a.model,a.sn,a.bought,age(a.bought),a.cost,a.cond,a.interval,a.lastPms,p.due||'',p.t]});
 const csv=[h,...rows].map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n');
 try{const d=await claude.use('downloads');if(d){await d.save({filename:'asset-report.csv',data:csv});return}}catch(e){}
 try{const b=new Blob([csv],{type:'text/csv'});const u=URL.createObjectURL(b);const x=document.createElement('a');x.href=u;x.download='asset-report.csv';x.click()}catch(e){alert('Download unavailable here.')}
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
init();
</script></body></html>
